# SIPROC con Docker: web, worker de colas, scheduler, PostgreSQL, Redis y Mailpit.
#
#   docker compose up -d --build        levanta todo en http://localhost:8000
#   docker compose up -d postgres redis mailpit
#                                       solo los servicios, para seguir corriendo PHP en tu equipo
#
# Toma las variables del .env del proyecto. Las de "x-laravel-env" las reemplazan dentro de los
# contenedores para que apunten a los servicios de Docker. Más detalles en el README.

name: siproc

x-laravel-env: &laravel-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  # Los correos van a Mailpit (http://localhost:8025) y no salen a internet.
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_SCHEME: smtp
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  LOG_CHANNEL: stderr

x-laravel: &laravel
  build: .
  image: siproc-app
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/app/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *laravel
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8000}:80"

  queue:
    <<: *laravel
    environment: *laravel-env
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *laravel
    environment: *laravel-env
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-SIPROC}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea también la base de los tests (siproc_test) la primera vez.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-siproc-test.sql:ro
    ports:
      # 5433 para no chocar con un PostgreSQL instalado en el equipo.
      - "${FORWARD_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:
  storage:
