name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siproc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siproc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # phpunit.xml fija DB_DATABASE=siproc_test; el resto de la conexión sale de aquí.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, gd, zip, intl, mbstring, fileinfo
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Las vistas usan @vite, así que los tests necesitan el manifest compilado.
      - name: Compilar CSS y JS
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Correr tests
        run: php artisan test
