; Ajustes de PHP para el contenedor de SIPROC.

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
expose_php = Off

; OPcache: sin él cada petición recompila Laravel completo.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de la imagen, así que no hace falta revisar fechas de archivos.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
